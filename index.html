<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Seat Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SEARCH SCREEN -->
   <body>

    <!-- LOADING SCREEN -->
    <div id="loadingScreen">
        <h2>WELCOME</h2>
    </div>

    <!-- SEARCH SCREEN -->
    <div class="container" style="display:none;">

        <h2 id="eventName"></h2>

        <p id="venueName"></p>

        <p id="eventDate"></p>

        <h1>Find Your Seat</h1>

        <div class="search-container">

            <input
                type="text"
                id="guestName"
                placeholder="Enter your name"
                autocomplete="off">

            <div id="suggestions" class="suggestions-box"></div>

        </div>

        <button onclick="findSeat()">
            Find Table
        </button>

        <div id="errorMessage" class="error-message"></div>
        
   </div>

    <!-- RESULT SCREEN -->
   <div id="resultCard" class="result-card" style="display:none;">

    <h1>Your Seat Awaits</h1>

    <div id="guestDisplay"></div>

    <p id="tableDisplay"></p>

   <img id="floorPlanImage"
     src="floorplan.jpg"
     alt="Floor Plan"
     onclick="openFloorPlan()">

    <button onclick="closeResult()">
        Close
    </button>

</div>

    <div id="imageModal" class="image-modal">
    <span class="close-image" onclick="closeFloorPlan()">
        &times;
    </span>

    <img id="fullFloorPlan"
         src="floorplan.jpg"
         alt="Floor Plan">
</div>
    
    <script src="script.js"> </script>

</body>
</html>
